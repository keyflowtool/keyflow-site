<style>
/* Layout: same nav and footer as the rest of the site; a short message with the key and two ways back. */
:root{
  --bg:#101210; --panel:#171a17; --panel-2:#1e221e; --line:#2a2f29; --line-2:#383e37;
  --fg:#f2f4ee; --muted:#9ca295; --dim:#6d7368; --lime:#a3cb3c; --orange:#fe791c;
  --display:"Fredoka","Varela Round","Nunito",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);width:100%}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(16,18,16,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:20px;height:64px;max-width:1240px}
.nav-links{display:flex;gap:4px;margin-left:auto}
.nav-links a{text-decoration:none;color:var(--muted);font-weight:500;font-size:14px;padding:8px 16px;border-radius:999px}
.nav-links a:hover{color:var(--fg);background:var(--panel-2)}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:600 15px var(--body);padding:12px 20px;border-radius:999px;border:1px solid transparent;transition:transform .15s,background .15s,border-color .15s}
.btn:hover{transform:translateY(-1px)}
.btn-lime{background:var(--lime);color:#121510}
.btn-lime:hover{background:#b4d94e}
.btn-ghost{border-color:var(--line-2);color:var(--fg)}
.btn-ghost:hover{border-color:var(--muted)}
.btn-sm{padding:8px 16px;font-size:14px}
@media (max-width:900px){.nav-links a:not(.nav-cl){display:none}}

main{flex:1;display:grid;place-items:center;padding-block:clamp(56px,10vw,120px)}
.lost{text-align:center;max-width:34em;margin-inline:auto}
.lost img{width:160px;height:auto;display:block;margin:0 auto 34px;opacity:.95}
.code{font:700 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
.lost h1{font:600 clamp(36px,6vw,60px)/1.05 var(--display);margin:14px 0 0;text-wrap:balance}
.lost h1 span{color:var(--lime)}
.lost p{color:var(--muted);font-size:18px;margin:16px 0 0}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:30px}

footer{border-top:1px solid var(--line);padding-block:26px;color:var(--dim);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--fg)}
.contact{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.contact-lbl{font:700 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
footer .contact a{color:var(--fg);font-weight:600;user-select:all}
</style>
</head>
<body>

</header>

      </div>
    </section>
  </div>
</main>

<footer>

</html>

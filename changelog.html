<style>
/* Layout: sticky version index on the left, release entries on the right; one column on phones. */
:root{
  --bg:#101210; --panel:#171a17; --panel-2:#1e221e; --line:#2a2f29; --line-2:#383e37;
  --fg:#f2f4ee; --muted:#9ca295; --dim:#6d7368;
  --lime:#a3cb3c; --lime-soft:rgba(163,203,60,.12); --orange:#fe791c; --orange-soft:rgba(254,121,28,.13);
  --blue:#7fa6d6; --blue-soft:rgba(127,166,214,.13);
  --display:"Fredoka","Varela Round","Nunito",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
h1,h2{font-family:var(--display);font-weight:600;line-height:1.05;margin:0;text-wrap:balance}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(16,18,16,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:16px;height:64px}
.nav img{height:24px;width:auto;display:block}
.nav .crumb{font:700 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line-2);padding-left:14px}
.back{margin-left:auto;text-decoration:none;font-weight:600;font-size:14px;color:var(--muted);padding:8px 14px;border:1px solid var(--line-2);border-radius:999px}
.back:hover{color:var(--fg);border-color:var(--muted)}
.nav .wrap{gap:20px;max-width:1240px}
.nav-links{display:flex;gap:4px;margin-left:auto}
.nav-links a{text-decoration:none;color:var(--muted);font-weight:500;font-size:14px;padding:8px 16px;border-radius:999px}
.nav-links a:hover{color:var(--fg);background:var(--panel-2)}
.nav-links a.on{background:var(--orange);color:#121510}
.nav-links a.on:hover{background:#ff8f3d;color:#121510}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:600 15px var(--body);padding:12px 20px;border-radius:999px;border:1px solid transparent;transition:transform .15s,background .15s,border-color .15s}
.btn:hover{transform:translateY(-1px)}
.btn-lime{background:var(--lime);color:#121510}
.btn-lime:hover{background:#b4d94e}
.btn-sm{padding:8px 16px;font-size:14px}
@media (max-width:900px){.nav-links a:not(.nav-cl){display:none}}

.head{padding-block:clamp(40px,7vw,80px) clamp(28px,4vw,40px)}
.eyebrow{font:700 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.head h1{font-size:clamp(44px,7vw,84px);margin-top:14px}
.head h1 span{color:var(--lime)}
.head p{color:var(--muted);max-width:36em;margin:18px 0 0;font-size:18px}
.head-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.pill{display:inline-flex;align-items:center;gap:8px;font:600 13px var(--body);padding:8px 14px;border-radius:999px;border:1px solid var(--line-2);color:var(--fg);text-decoration:none}
.pill:hover{border-color:var(--muted)}
.pill.cur{background:var(--lime);border-color:var(--lime);color:#121510}

.dot{width:8px;height:8px;border-radius:50%;flex:none}
.d-new{background:var(--lime)} .d-imp{background:var(--blue)} .d-fix{background:var(--orange)}

.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:clamp(24px,5vw,64px);padding-block:36px 80px;border-top:1px solid var(--line)}
.index{position:sticky;top:96px;align-self:start;max-height:calc(100vh - 116px);overflow:auto}
.index h2{font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
.index ol{list-style:none;margin:0 0 22px;padding:0}
.index a{display:flex;justify-content:space-between;gap:10px;text-decoration:none;padding:6px 10px;margin:1px 0;border-radius:8px;font:600 14px var(--body);color:var(--muted);transition:background .15s,color .15s}
.index a small{font:500 11px var(--mono);color:var(--dim);font-variant-numeric:tabular-nums}
.index a:hover{color:var(--fg);background:rgba(255,255,255,.04)}
/* The release in view: a soft lime rectangle with rounded corners. */
.index a.on{color:var(--fg);background:rgba(163,203,60,.14);box-shadow:inset 0 0 0 1px rgba(163,203,60,.22)}

.rel{display:grid;grid-template-columns:150px minmax(0,1fr);gap:24px;padding-block:34px;border-bottom:1px solid var(--line);scroll-margin-top:96px}
.rel:first-child{padding-top:0}
.meta{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.ver{font:600 30px/1 var(--display);text-decoration:none}
.ver:hover{color:var(--lime)}
/* The latest release always shows its number in lime, in the list and in the index. */
.rel.is-latest .ver,.index a.is-latest{color:var(--lime)}
.date{font:500 12.5px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.body h2{font-size:clamp(22px,2.6vw,28px);margin-bottom:16px}
.items{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.items li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:14px;align-items:baseline}
.tag{justify-self:start;font:700 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:3px 8px}
.t-new{color:var(--lime);background:var(--lime-soft)}
.t-imp{color:var(--blue);background:var(--blue-soft)}
.t-fix{color:var(--orange);background:var(--orange-soft)}
.items p{margin:0;color:#d6dacf;font-size:15.5px;line-height:1.55}
.items b{color:var(--fg);font-weight:600}
.items li[data-k="n"] b,.items li[data-k="-"] b{color:var(--lime)}
.items li[data-k="i"] b{color:var(--blue)}
.items li[data-k="f"] b{color:var(--orange)}
.items li[data-k="-"]{grid-template-columns:minmax(0,1fr)}
.rel .body{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px}

footer{border-top:1px solid var(--line);padding-block:26px;color:var(--dim);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--fg)}
footer .wrap{align-items:center}
.contact{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.contact-lbl{font:700 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
footer .contact a{color:var(--fg);font-weight:600;user-select:all}

@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .index{display:none}
  .rel{grid-template-columns:minmax(0,1fr);gap:14px}
  .meta{flex-direction:row;align-items:center;flex-wrap:wrap;gap:12px}
}
@media (max-width:520px){
  .items li{grid-template-columns:minmax(0,1fr);gap:6px}
  .nav .crumb{display:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.nav .wrap > .crumb:first-child{border-left:0;padding-left:0}
/* Page-to-page: a quick cross-fade instead of a blank flash (Chromium, same-origin). */
@view-transition{navigation:auto}
::view-transition-old(root),::view-transition-new(root){animation-duration:.16s}
</style>

<main>
  <section class="head">
    <div class="wrap">
      <p class="eyebrow">Release notes</p>
      <h1>What's new in <span>KeyFlow</span></h1>
      <p>Updates are free, and each one installs on top of the version you have.</p>
      <div class="head-row">
        <a class="pill cur" id="latest-pill" href="#v1.6.8.1">Latest: 1.6.8.1</a>
      </div>
    </div>
  </section>

  <div class="wrap">

      <nav class="index" aria-label="Versions" id="index"></nav>
      <div id="releases"></div>

</main>

<footer>
  <div class="wrap">
    <span>© 2026 KeyFlow</span>
    <div class="contact">
      <span class="contact-lbl">Contact</span>
      <a id="kf-mail" href="mailto:keyflowtool@gmail.com">keyflowtool@gmail.com</a>
    </div>
    <div class="ft-end ft-social"><a href="index.html">Home</a><a href="https://www.instagram.com/keyflowtool/" target="_blank" rel="noopener" aria-label="KeyFlow on Instagram" title="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" class="dot"/></svg></a><a href="https://www.youtube.com/@Keyflowtool" target="_blank" rel="noopener" aria-label="KeyFlow on YouTube" title="YouTube"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10 9.2v5.6l4.8-2.8z" class="dot"/></svg></a></div>
  </div>
</footer>

<script>
(() => {
  // Every page opens at the top, unless the link points to a section (#...).
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  const toTop = () => { if (!location.hash) window.scrollTo({ top: 0, left: 0, behavior: "instant" }); };
  toTop();
  // Only if the visitor has not started scrolling yet: the load event waits for the videos, and jumping back to
  // the top then felt like the wheel got stuck (2026-10-24).
  let kfMoved = false;
  ["wheel", "keydown", "touchstart", "mousedown"].forEach(t => addEventListener(t, () => { kfMoved = true; }, { passive: true, once: true }));
  const toTopIfIdle = () => { if (!kfMoved && scrollY < 2 * innerHeight) toTop(); };
  addEventListener("load", toTopIfIdle);
  addEventListener("pageshow", e => { if (e.persisted) { kfMoved = false; toTop(); } });
  // n = new, i = improved, f = fixed
  const R = [
    { v:"1.6.8.1", d:"2026-11-11", t:"Small fixes", c:[
      ["f","Small fixes and stability improvements."]]},
    { v:"1.6.8", d:"2026-11-11", t:"Line of Action, faster Onion Skin, exact MotionTrail", big:true, c:[
      ["n","<b>Line of Action.</b> A live line through the controls you pick, in order, to read the flow of the pose."],
      ["i","<b>Select Hierarchy Animated</b> about 100× faster, from anything selected; right-click for Controls Only or Isolate."],
      ["i","<b>Onion Skin</b> redraws only the frames that changed, and reopens instantly."],
      ["f","<b>MotionTrail</b> follows the exact path on rigs with constraints and layers, and keeps Maya light."],
      ["i","<b>Grips</b> has a cleaner window, and every help window shares one style."]]},
    { v:"1.6.7", d:"2026-11-08", t:"Pivot Grab / Release, Grips and Onion Skin", big:true, c:[
      ["n","<b>Pivot Grab / Release.</b> A temp pivot that follows an object and lets it go, as many times as you need. Move it from one object to another without moving the rig; Bake turns it into regular keys on your controls."],
      ["n","<b>Grips.</b> A colored shape on each control: grab it and the control moves, with keys and undo as usual. Pick the shape, color and size, or edit the shape itself."],
      ["n","<b>Onion Skin.</b> See the geometry and the grips before and after the current frame, with their outline, colors and opacity."],
      ["i","<b>Select Opposite, Reset and Copy / Paste Animation</b> are faster, <b>Visibility Sets</b> is improved, and on-screen messages are easier to read."]]},
    { v:"1.6.6", d:"2026-11-03", t:"Faster, exact Mirror", big:true, c:[
      ["i","<b>Mirror Animation and Snapshot.</b> Up to 17× and 5 to 12× faster; Undo after Flip is almost instant."],
      ["i","<b>Nudge Keys and Move Keys</b> work inside the timeline range, and the range stays highlighted."],
      ["f","<b>Mirror</b> on rigs built with negative scale, and <b>Copy / Paste Keys</b> on controls with IK/FK blends."]]},
    { v:"1.6.5", d:"2026-11-02", t:"Tangents", big:true, c:[
      ["n","<b>Tangents section.</b> Blend to Tangent, Flow, Best Guess, Bounce and Cycle Match, plus Auto, Spline, Clamped, Linear, Flat and Plateau as sliders."],
      ["n","<b>Spacing Blend.</b> Eases the keys between two poses into an S, keeping them on their frames."],
      ["i","<b>Dynamics.</b> Branches, Jiggle, and ignore the COG per chain."],
      ["i","<b>Hotkeys.</b> Organized in groups, every tangent slider with ±5 / 15 / 50 / 100, and a new Tangents group."]]},
    { v:"1.6.4", d:"2026-10-29", t:"Visibility Sets", big:true, c:[
      ["n","<b>Visibility Sets.</b> Hide and show any control, even when its visibility is locked, and build the character parts automatically from the rig root: Face, Hair, Hands, Feet, Front / Back Legs, Wings and Tail."],
      ["i","<b>Select Sets</b> builds the whole character structure from the root control."]]},
    { v:"1.6.3", d:"2026-10-27", t:"Copy / Paste Keys and Bake on N", big:true, c:[
      ["i","<b>Copy / Paste Keys</b> pastes onto other attributes, onto selected keys and inside the highlighted time slider range."],
      ["i","<b>Bake on N</b> gives cleaner tangents, and Stepped holds every key, the first and last included."],
      ["i","<b>World Lock:</b> the path can follow a curve you draw."],
      ["i","<b>Remove Static / Redundant:</b> picking an option in the right-click menu applies it at once."],
      ["i","<b>Space Timing</b> has a Reset button."]]},
    { v:"1.6.2", d:"2026-10-25", t:"Space Timing", big:true, c:[
      ["n","<b>Space Timing.</b> Clean spacing between two keys: a smooth ease, timing charts, gravity, anticipation and overshoot, using only the keys you already have."],
      ["i","<b>Smart Euler Filter</b> and <b>Fix Gimbal</b> are more reliable; Fix Gimbal leaves a control alone when it has no gimbal risk."],
      ["i","General performance improvements."]]},
    { v:"1.6.0", d:"2026-10-21", t:"Small bug fixes", big:true, c:[
      ["f","Small bug fixes and improvements."]]},
  ];
  // Inside each release: New, then Improved, then Fixed.
  const ORDER = { "-":0, n:1, i:2, f:3 };
  const TYPES = { n:["New","t-new","d-new"], i:["Improved","t-imp","d-imp"], f:["Fixed","t-fix","d-fix"], "-":["","t-none",""] };
  const fmt = iso => new Date(iso + "T12:00:00").toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" });
  const id = v => "v" + v;

  // The header pill always points at the newest release (first in R).
  const pill = document.getElementById("latest-pill");
  if (pill && R[0]) { pill.textContent = "Latest: " + R[0].v; pill.href = "#" + id(R[0].v); }

  // Releases.
  const list = document.getElementById("releases");
  R.forEach((r, i) => {
    const el = document.createElement("article");
    el.className = "rel" + (r.big ? " big" : "") + (i === 0 ? " is-latest" : ""); el.id = id(r.v);
    el.innerHTML = `
      <div class="meta">
        <a class="ver" href="#${id(r.v)}">${r.v}</a>
        <time class="date" datetime="${r.d}">${fmt(r.d)}</time>
      </div>
      <div class="body">
        <h2>${r.t}</h2>
        <ul class="items">${r.c.slice().sort((a, b) => ORDER[a[0]] - ORDER[b[0]]).map(([k, txt]) => `<li data-k="${k}">${TYPES[k][0] ? `<span class="tag ${TYPES[k][1]}">${TYPES[k][0]}</span>` : ""}<p>${txt}</p></li>`).join("")}</ul>
      </div>`;
    list.appendChild(el);
  });

  // Version index, grouped by release line.
  const index = document.getElementById("index");
  const lines = {};
  R.forEach(r => { const k = r.v.split(".").slice(0, 2).join("."); (lines[k] = lines[k] || []).push(r); });
  Object.entries(lines).forEach(([line, rs]) => {
    const h = document.createElement("h2"); h.textContent = "KeyFlow " + line;
    const ol = document.createElement("ol");
    rs.forEach(r => { ol.insertAdjacentHTML("beforeend", `<li><a href="#${id(r.v)}" data-v="${r.v}"${r === R[0] ? ' class="is-latest"' : ""}>${r.v}<small>${fmt(r.d).replace(/, \d{4}$/, "")}</small></a></li>`); });
    index.append(h, ol);
  });

  // Highlight the version in view: the last release whose top has reached the line under the nav
  // (releases jump to 96px, see scroll-margin-top), so short releases never steal the highlight.
  const links = [...index.querySelectorAll("a")];
  const rels = [...list.querySelectorAll(".rel")];
  let raf = 0, hold = 0;
  const mark = id => links.forEach(a => a.classList.toggle("on", "v" + a.dataset.v === id));
  const pick = () => {
    raf = 0;
    if (Date.now() < hold) return;               // a version was just picked from the index
    let cur = rels[0];
    for (const r of rels) { if (r.getBoundingClientRect().top <= 110) cur = r; else break; }
    // At the very bottom the last releases can't reach the top, so the last one wins.
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 2) cur = rels[rels.length - 1];
    if (cur) mark(cur.id);
  };
  addEventListener("scroll", () => { if (!raf) raf = requestAnimationFrame(pick); }, { passive: true });
  addEventListener("hashchange", () => {
    if (document.getElementById(location.hash.slice(1))) { mark(location.hash.slice(1)); hold = Date.now() + 300; }
  });
  pick();
})();
</script>
